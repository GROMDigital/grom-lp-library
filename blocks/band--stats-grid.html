<section class="lp-band-stats-grid">
  <style>
    .lp-band-stats-grid{position:relative;overflow:hidden;background:var(--band-dark-bg);color:var(--band-dark-ink);padding:var(--space-section) var(--gutter)}
    .lp-band-stats-grid .glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
    .lp-band-stats-grid .glow.a{width:340px;height:340px;background:var(--glow-1);opacity:.18;top:-120px;right:-80px}
    .lp-band-stats-grid .glow.b{width:300px;height:300px;background:var(--glow-2);opacity:.12;bottom:-130px;left:-70px}
    .lp-band-stats-grid .in{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1fr;gap:clamp(30px,4vw,52px);align-items:center}
    .lp-band-stats-grid .kicker{font-family:var(--font-body);font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 .9em}
    .lp-band-stats-grid .say{font-family:var(--font-display);font-size:var(--fs-h2);line-height:1.15;color:var(--band-dark-ink);margin:0;max-width:22ch}
    .lp-band-stats-grid .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:color-mix(in srgb, var(--band-dark-ink) 16%, transparent);border:1px solid color-mix(in srgb, var(--band-dark-ink) 16%, transparent);border-radius:var(--radius);overflow:hidden}
    .lp-band-stats-grid .stat{min-width:0;background:var(--band-dark-bg);padding:clamp(22px,3vw,32px) clamp(18px,2.6vw,28px)}
    .lp-band-stats-grid .n{display:block;font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,4.4vw,3rem);line-height:1;color:var(--band-dark-ink);overflow-wrap:anywhere}
    .lp-band-stats-grid .n .u{font-size:.5em;color:var(--accent);margin-left:.08em}
    .lp-band-stats-grid .l{display:block;font-family:var(--font-body);font-size:.9rem;line-height:1.4;color:color-mix(in srgb, var(--band-dark-ink) 66%, transparent);margin-top:.85em}
    @media (min-width:768px){
      .lp-band-stats-grid .in{grid-template-columns:.92fr 1.08fr}
    }
  </style>
  <div class="glow a" aria-hidden="true"></div>
  <div class="glow b" aria-hidden="true"></div>
  <div class="in">
    <div class="reveal">
      <p class="kicker">{{stats_kicker}}</p>
      <p class="say">{{stats_statement}}</p>
    </div>
    <div class="grid reveal-stagger">
      <div class="stat">
        <span class="n" data-count-to="{{stat_1_value}}">{{stat_1_value}}<span class="u">{{stat_1_unit}}</span></span>
        <span class="l">{{stat_1_label}}</span>
      </div>
      <div class="stat">
        <span class="n" data-count-to="{{stat_2_value}}">{{stat_2_value}}<span class="u">{{stat_2_unit}}</span></span>
        <span class="l">{{stat_2_label}}</span>
      </div>
      <div class="stat">
        <span class="n" data-count-to="{{stat_3_value}}">{{stat_3_value}}<span class="u">{{stat_3_unit}}</span></span>
        <span class="l">{{stat_3_label}}</span>
      </div>
      <div class="stat">
        <span class="n" data-count-to="{{stat_4_value}}">{{stat_4_value}}<span class="u">{{stat_4_unit}}</span></span>
        <span class="l">{{stat_4_label}}</span>
      </div>
    </div>
  </div>
</section>
