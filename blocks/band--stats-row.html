<section class="lp-band-stats-row">
  <style>
    .lp-band-stats-row{position:relative;overflow:hidden;background:var(--band-dark-bg);color:var(--band-dark-ink);padding:var(--space-section) var(--gutter)}
    .lp-band-stats-row .glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;width:360px;height:360px;background:var(--glow-1);opacity:.16;top:-140px;left:50%;transform:translateX(-50%)}
    .lp-band-stats-row .in{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto}
    .lp-band-stats-row .quote{max-width:min(48rem,100%);margin:0 0 clamp(34px,5vw,56px)}
    .lp-band-stats-row .kicker{font-family:var(--font-body);font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 1em}
    .lp-band-stats-row .say{position:relative;font-family:var(--font-display);font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.22;color:var(--band-dark-ink);margin:0;padding-left:.9em}
    .lp-band-stats-row .say::before{content:"\201C";position:absolute;left:-.06em;top:.06em;font-family:var(--font-display);font-size:2.4em;line-height:1;color:var(--accent);opacity:.5}
    .lp-band-stats-row .figures{display:flex;flex-wrap:wrap;border-top:1px solid color-mix(in srgb, var(--band-dark-ink) 16%, transparent);padding-top:clamp(26px,3.4vw,40px)}
    .lp-band-stats-row .fig{flex:1 1 0;min-width:0;padding:0 clamp(16px,3vw,32px)}
    .lp-band-stats-row .fig:first-child{padding-left:0}
    .lp-band-stats-row .fig:last-child{padding-right:0}
    .lp-band-stats-row .fig + .fig{border-left:1px solid color-mix(in srgb, var(--band-dark-ink) 16%, transparent)}
    .lp-band-stats-row .n{display:block;font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1;color:var(--band-dark-ink);overflow-wrap:anywhere}
    .lp-band-stats-row .n .u{font-size:.46em;color:var(--accent);margin-left:.08em}
    .lp-band-stats-row .l{display:block;font-family:var(--font-body);font-size:.88rem;line-height:1.4;color:color-mix(in srgb, var(--band-dark-ink) 66%, transparent);margin-top:.8em}
    @media (max-width:600px){
      .lp-band-stats-row .fig{flex:1 1 100%;padding:clamp(18px,5vw,24px) 0}
      .lp-band-stats-row .fig:first-child{padding-top:0}
      .lp-band-stats-row .fig + .fig{border-left:none;border-top:1px solid color-mix(in srgb, var(--band-dark-ink) 16%, transparent)}
    }
  </style>
  <div class="glow" aria-hidden="true"></div>
  <div class="in">
    <div class="quote reveal">
      <p class="kicker">{{stats_kicker}}</p>
      <p class="say">{{stats_statement}}</p>
    </div>
    <div class="figures reveal-stagger">
      <div class="fig">
        <span class="n" data-count-to="{{stat_1_value}}">{{stat_1_value}}<span class="u">{{stat_1_unit}}</span></span>
        <span class="l">{{stat_1_label}}</span>
      </div>
      <div class="fig">
        <span class="n" data-count-to="{{stat_2_value}}">{{stat_2_value}}<span class="u">{{stat_2_unit}}</span></span>
        <span class="l">{{stat_2_label}}</span>
      </div>
      <div class="fig">
        <span class="n" data-count-to="{{stat_3_value}}">{{stat_3_value}}<span class="u">{{stat_3_unit}}</span></span>
        <span class="l">{{stat_3_label}}</span>
      </div>
    </div>
  </div>
</section>
