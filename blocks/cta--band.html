<section class="lp-cta-band">
  <style>
    .lp-cta-band,.lp-cta-band *{box-sizing:border-box}
    .lp-cta-band{position:relative}
    /* the band carries the dark treatment; default = full-bleed edge-to-edge */
    .lp-cta-band .band{position:relative;overflow:hidden;background:var(--band-dark-bg);color:var(--band-dark-ink);padding:var(--space-section) var(--gutter);text-align:center}
    .lp-cta-band .band-photo{display:none}
    /* decorative glow, contained: sits behind and clipped by the band, never crosses the text */
    .lp-cta-band .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:1}
    .lp-cta-band .glow-a{width:300px;height:300px;top:-120px;right:-60px;background:color-mix(in srgb,var(--accent) 42%,transparent)}
    .lp-cta-band .glow-b{width:260px;height:260px;bottom:-120px;left:-50px;background:color-mix(in srgb,var(--band-dark-ink) 16%,transparent)}
    .lp-cta-band .in{position:relative;z-index:2;max-width:640px;margin:0 auto}
    .lp-cta-band .eyebrow{display:inline-flex;align-items:center;gap:.5em;font-family:var(--font-body);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--band-dark-ink) 72%,transparent);border:1px solid color-mix(in srgb,var(--band-dark-ink) 22%,transparent);border-radius:var(--r-pill);padding:.5em 1em;margin:0 0 1.2em}
    .lp-cta-band .eyebrow .dot{display:none;width:6px;height:6px;border-radius:50%;background:var(--band-dark-ink);opacity:.85;flex:none}
    .lp-cta-band h2{font-family:var(--font-display);font-size:var(--fs-h2);line-height:1.12;color:var(--band-dark-ink);margin:0 0 .5em;max-width:16ch;margin-inline:auto}
    .lp-cta-band .sub{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:color-mix(in srgb,var(--band-dark-ink) 78%,transparent);margin:0 auto 1.8em;max-width:44ch}
    .lp-cta-band .cta{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-family:var(--font-body);font-size:1.05rem;font-weight:700;color:var(--accent-ink);background:linear-gradient(180deg,var(--cta-grad-a),var(--cta-grad-b));border:none;border-radius:var(--btn-radius);box-shadow:var(--shadow-cta);padding:.95em 1.8em;cursor:pointer;text-decoration:none}
    .lp-cta-band .reassure{display:flex;align-items:center;justify-content:center;gap:.5em;font-family:var(--font-body);font-size:.85rem;color:color-mix(in srgb,var(--band-dark-ink) 66%,transparent);margin:1.2em 0 0}
    .lp-cta-band .reassure svg{flex:none;opacity:.85}

    /* --framed VARIANT (opt-in): the band becomes a rounded, inset card centered
       within its own section padding, optionally over a darkened treatment photo,
       with a light (surface) button. Default full-bleed band above is untouched. */
    .lp-cta-band--framed{padding:var(--space-section) var(--gutter)}
    .lp-cta-band--framed .band{max-width:var(--maxw);margin:0 auto;border-radius:var(--radius);box-shadow:var(--shadow-lg);background:linear-gradient(165deg,var(--accent-deep),var(--accent) 60%,var(--accent-soft));padding:clamp(52px,7vw,76px) clamp(26px,4vw,40px)}
    .lp-cta-band--framed .band-photo{display:block;position:absolute;inset:0;z-index:0}
    .lp-cta-band--framed .band-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.65) brightness(.85);transform:scale(1.04)}
    .lp-cta-band--framed .band-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(165deg,color-mix(in srgb,var(--accent-deep) 92%,transparent),color-mix(in srgb,var(--accent) 82%,transparent))}
    .lp-cta-band--framed .glow{background:color-mix(in srgb,var(--band-dark-ink) 18%,transparent)}
    .lp-cta-band--framed .eyebrow{background:color-mix(in srgb,var(--band-dark-ink) 14%,transparent);border-color:color-mix(in srgb,var(--band-dark-ink) 18%,transparent)}
    .lp-cta-band--framed .eyebrow .dot{display:inline-block}
    .lp-cta-band--framed .cta{background:var(--surface);color:var(--accent-deep);box-shadow:0 16px 34px -12px color-mix(in srgb,var(--ink) 35%,transparent)}
  </style>
  <div class="band">
    <div class="band-photo" aria-hidden="true"><img src="{{cta_bg_image}}" alt=""></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>
    <div class="in reveal">
      <span class="eyebrow"><span class="dot" aria-hidden="true"></span> {{cta_eyebrow}}</span>
      <h2>{{cta_headline}}</h2>
      <p class="sub">{{cta_subhead}}</p>
      <a class="cta" href="#book" data-cta>
        {{cta_button}}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <p class="reassure">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
        {{cta_reassurance}}
      </p>
    </div>
  </div>
</section>
