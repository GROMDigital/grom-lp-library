<footer class="lp-footer-centered">
  <style>
    /* FOOTER ARCHETYPE: a light, centered close, an italic wordmark over an
       address line and a fine-print disclaimer. The quiet counterpart to
       footer--multicol's dark 4-column band, for pages that end on the page
       background rather than a dark slab, and that have no directory of
       contact/hours to list. Always last. Tokens only. */
    .lp-footer-centered,.lp-footer-centered *{box-sizing:border-box}
    .lp-footer-centered{background:var(--bg);padding:40px var(--gutter) calc(96px + env(safe-area-inset-bottom));text-align:center}
    .lp-footer-centered .name{display:block;font-family:var(--font-display);font-weight:600;font-style:italic;font-size:clamp(17px,4vw,20px);letter-spacing:.01em;color:var(--accent-deep);margin:0 0 10px}
    .lp-footer-centered .addr{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:500;margin:0 0 4px}
    .lp-footer-centered .fine{font-family:var(--font-body);font-size:11.5px;color:var(--muted);opacity:.8;margin:14px 0 0;max-width:60ch;margin-inline:auto;line-height:1.6}
    @media (min-width:1024px){
      .lp-footer-centered{padding-bottom:56px}
    }
  </style>
  <span class="name">{{clinic_name}}</span>
  <p class="addr">{{footer_address}}</p>
  <p class="fine">{{footer_disclaimer}}</p>
</footer>
