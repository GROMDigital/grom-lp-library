<section class="lp-hero-centered" id="hero">
  <style>
    /* HERO ARCHETYPE: centered editorial. Single centered column, no media
       panel. Choreographed entrance via .reveal-stagger on the copy stack.
       Soft ambient glows behind. Differs from hero--split (2-col) and
       hero--fullbleed (dark overlay band). */
    .lp-hero-centered{position:relative;background:var(--bg);padding:calc(var(--space-section) + 1vw) var(--gutter);overflow:hidden;text-align:center}
    .lp-hero-centered .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
    .lp-hero-centered .glow.g1{width:420px;height:420px;background:var(--glow-1);top:-160px;left:50%;margin-left:-320px;opacity:.9}
    .lp-hero-centered .glow.g2{width:320px;height:320px;background:var(--glow-2);bottom:-120px;left:50%;margin-left:60px;opacity:.7}
    .lp-hero-centered .in{position:relative;z-index:1;max-width:min(760px,100%);margin:0 auto}
    .lp-hero-centered .eyebrow{display:inline-flex;align-items:center;gap:.55em;color:var(--accent);background:var(--surface);border:1px solid var(--border);font-family:var(--font-body);letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;font-weight:700;padding:.5em 1em;border-radius:var(--r-pill)}
    .lp-hero-centered .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
    .lp-hero-centered h1{font-family:var(--font-display);font-size:var(--fs-h1);color:var(--ink);line-height:1.04;letter-spacing:-.01em;margin:.5em auto .4em;max-width:16ch}
    .lp-hero-centered h1 em{font-style:italic;color:var(--accent)}
    .lp-hero-centered .subhead{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);margin:0 auto 1.6em;max-width:52ch}
    .lp-hero-centered .cta-block{margin:0 auto}
    .lp-hero-centered .btn-primary{display:inline-flex;align-items:center;gap:.6em;background:linear-gradient(90deg,var(--cta-grad-a),var(--cta-grad-b));color:var(--accent-ink);font-family:var(--font-body);font-weight:700;font-size:1.02rem;padding:1.05em 2.1em;border-radius:var(--r-pill);box-shadow:var(--shadow-cta);text-decoration:none}
    .lp-hero-centered .btn-primary svg{flex:none}
    .lp-hero-centered .cta-micro{display:flex;align-items:center;justify-content:center;gap:.5em;font-family:var(--font-body);font-size:.82rem;color:var(--muted);margin:.9em 0 0}
    .lp-hero-centered .cta-micro svg{flex:none;opacity:.6}
    .lp-hero-centered .trust-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.7em 1.6em;margin-top:2em;padding-top:1.5em;border-top:1px solid var(--border)}
    .lp-hero-centered .trust-item{display:inline-flex;align-items:center;gap:.5em;font-family:var(--font-body);font-size:.85rem;font-weight:600;color:var(--muted)}
    .lp-hero-centered .trust-item svg{flex:none;color:var(--accent)}
    .lp-hero-centered .stars{color:var(--accent);letter-spacing:2px;font-size:.9rem}
  </style>
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>
  <div class="in reveal-stagger">
    <span class="eyebrow"><span class="dot" aria-hidden="true"></span>{{hero_eyebrow}}</span>
    <!-- headline: keep the <em> around one or two words for emphasis -->
    <h1>{{hero_headline}} <em>{{hero_headline_emphasis}}</em></h1>
    <p class="subhead">{{hero_subhead}}</p>
    <div class="cta-block">
      <a class="btn-primary" href="#book">
        {{primary_cta_label}}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <p class="cta-micro">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
        {{cta_micro}}
      </p>
    </div>
    <div class="trust-row">
      <span class="trust-item"><span class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span> {{trust_rating}}</span>
      <span class="trust-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        {{trust_credential}}
      </span>
    </div>
  </div>
</section>
