<section class="lp-hero-fullbleed" id="hero">
  <style>
    /* HERO ARCHETYPE: full-bleed dark band. A full-width gradient/image band
       fills the section; copy sits bottom-left over a scrim with a floating
       price chip top-right. High-contrast, image-forward. Differs from
       hero--centered (light, centered) and hero--split (side-by-side columns
       on light bg). */
    .lp-hero-fullbleed{position:relative;overflow:hidden;min-height:clamp(520px,72vh,720px);display:flex;background:var(--band-dark-bg);color:var(--band-dark-ink)}
    .lp-hero-fullbleed .bleed{position:absolute;inset:0;z-index:0;color:var(--accent);background:
      radial-gradient(120% 90% at 80% 8%, color-mix(in srgb, var(--accent) 42%, transparent) 0%, transparent 55%),
      radial-gradient(100% 80% at 10% 96%, color-mix(in srgb, var(--band-dark-ink) 12%, transparent) 0%, transparent 55%),
      linear-gradient(160deg, color-mix(in srgb, var(--band-dark-bg) 70%, var(--accent)) 0%, var(--band-dark-bg) 62%)}
    .lp-hero-fullbleed .bleed svg{position:absolute;inset:0;width:100%;height:100%}
    .lp-hero-fullbleed .scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg, color-mix(in srgb, var(--band-dark-bg) 20%, transparent) 0%, transparent 34%, color-mix(in srgb, var(--band-dark-bg) 78%, transparent) 100%)}
    .lp-hero-fullbleed .in{position:relative;z-index:2;max-width:var(--maxw);margin:auto auto 0;width:100%;padding:var(--space-section) var(--gutter) calc(var(--space-section) * .8);display:flex;align-items:flex-end}
    .lp-hero-fullbleed .copy{max-width:38ch}
    .lp-hero-fullbleed .eyebrow{display:inline-flex;align-items:center;gap:.55em;font-family:var(--font-body);letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;font-weight:700;color:var(--band-dark-ink);background:color-mix(in srgb, var(--band-dark-ink) 14%, transparent);border:1px solid color-mix(in srgb, var(--band-dark-ink) 22%, transparent);padding:.5em 1em;border-radius:var(--r-pill)}
    .lp-hero-fullbleed .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
    .lp-hero-fullbleed h1{font-family:var(--font-display);font-size:var(--fs-h1);line-height:1.03;letter-spacing:-.01em;color:var(--band-dark-ink);margin:.55em 0 .4em}
    .lp-hero-fullbleed h1 em{font-style:italic;color:color-mix(in srgb, var(--accent) 55%, var(--band-dark-ink))}
    .lp-hero-fullbleed .subhead{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:color-mix(in srgb, var(--band-dark-ink) 76%, transparent);margin:0 0 1.5em}
    .lp-hero-fullbleed .btn-primary{display:inline-flex;align-items:center;gap:.6em;background:linear-gradient(90deg,var(--cta-grad-a),var(--cta-grad-b));color:var(--accent-ink);font-family:var(--font-body);font-weight:700;font-size:1.02rem;padding:1.05em 2.1em;border-radius:var(--r-pill);box-shadow:var(--shadow-cta);text-decoration:none}
    .lp-hero-fullbleed .btn-primary svg{flex:none}
    .lp-hero-fullbleed .cta-micro{display:flex;align-items:center;gap:.5em;font-family:var(--font-body);font-size:.82rem;color:color-mix(in srgb, var(--band-dark-ink) 70%, transparent);margin:.9em 0 0}
    .lp-hero-fullbleed .cta-micro svg{flex:none;opacity:.7}
    .lp-hero-fullbleed .price-chip{position:absolute;top:var(--gutter);right:var(--gutter);z-index:3;display:flex;align-items:baseline;gap:.6em;background:color-mix(in srgb, var(--band-dark-ink) 12%, transparent);border:1px solid color-mix(in srgb, var(--band-dark-ink) 24%, transparent);border-radius:var(--radius);padding:.8em 1.1em}
    .lp-hero-fullbleed .price-chip .label{display:block;font-family:var(--font-body);font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb, var(--band-dark-ink) 66%, transparent);margin:0 0 .25em}
    .lp-hero-fullbleed .price-chip .now{font-family:var(--font-display);font-weight:700;font-size:1.45rem;color:var(--band-dark-ink);line-height:1;font-variant-numeric:tabular-nums}
    .lp-hero-fullbleed .price-chip .was{font-family:var(--font-body);font-size:.78rem;color:color-mix(in srgb, var(--band-dark-ink) 60%, transparent);text-decoration:line-through;font-weight:600}
    @media (max-width:768px){
      .lp-hero-fullbleed .price-chip{position:static;margin:0 var(--gutter);align-self:flex-start}
      .lp-hero-fullbleed .in{padding-top:calc(var(--space-section) * 1.1)}
    }
  </style>
  <div class="bleed" aria-hidden="true">
    <svg viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="1.4">
        <circle cx="980" cy="150" r="120"/><circle cx="980" cy="150" r="180"/>
        <path d="M120 620 C 320 560, 520 560, 720 620 C 920 680, 1080 660, 1200 600"/>
      </g>
    </svg>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="price-chip">
    <div>
      <span class="label">{{price_label}}</span>
      <span class="now">{{offer_price}}</span>
    </div>
    <span class="was">{{offer_was_price}}</span>
  </div>
  <div class="in">
    <div class="copy reveal-stagger">
      <span class="eyebrow"><span class="dot" aria-hidden="true"></span>{{hero_eyebrow}}</span>
      <h1>{{hero_headline}} <em>{{hero_headline_emphasis}}</em></h1>
      <p class="subhead">{{hero_subhead}}</p>
      <div class="cta-block">
        <a class="btn-primary" href="#book">
          {{primary_cta_label}}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <p class="cta-micro">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
          {{cta_micro}}
        </p>
      </div>
    </div>
  </div>
</section>
