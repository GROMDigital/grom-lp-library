<section class="lp-hero-split2" id="hero">
  <style>
    /* HERO ARCHETYPE: asymmetric split. Copy column beside a taller media
       column that carries a parallax CSS/SVG scene plus a floating price
       card. Stacks under 768px (media moves below copy). Differs from
       hero--centered (single centered column) and hero--fullbleed (dark
       overlay band). */
    .lp-hero-split2{position:relative;background:var(--bg);padding:var(--space-section) var(--gutter);overflow:hidden}
    .lp-hero-split2 .glow{position:absolute;border-radius:50%;filter:blur(66px);pointer-events:none;z-index:0;width:340px;height:340px;background:var(--glow-1);top:-140px;right:-120px;opacity:.85}
    .lp-hero-split2 .in{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1.08fr .92fr;gap:calc(var(--gutter) * 1.4);align-items:center}
    .lp-hero-split2 .copy{text-align:left}
    .lp-hero-split2 .eyebrow{display:inline-block;color:var(--accent);font-family:var(--font-body);letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;font-weight:700}
    .lp-hero-split2 h1{font-family:var(--font-display);font-size:var(--fs-h1);color:var(--ink);line-height:1.05;letter-spacing:-.01em;margin:.45em 0 .4em;max-width:14ch}
    .lp-hero-split2 h1 em{font-style:italic;color:var(--accent)}
    .lp-hero-split2 .subhead{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);margin:0 0 1.5em;max-width:44ch}
    .lp-hero-split2 .btn-primary{display:inline-flex;align-items:center;gap:.6em;background:linear-gradient(90deg,var(--cta-grad-a),var(--cta-grad-b));color:var(--accent-ink);font-family:var(--font-body);font-weight:700;font-size:1rem;padding:1em 1.9em;border-radius:var(--r-pill);box-shadow:var(--shadow-cta);text-decoration:none}
    .lp-hero-split2 .btn-primary svg{flex:none}
    .lp-hero-split2 .cta-micro{display:flex;align-items:center;gap:.5em;font-family:var(--font-body);font-size:.82rem;color:var(--muted);margin:.9em 0 0}
    .lp-hero-split2 .cta-micro svg{flex:none;opacity:.6}
    .lp-hero-split2 .media{position:relative}
    .lp-hero-split2 .scene{position:relative;aspect-ratio:4/4.6;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);color:var(--accent);background:
      radial-gradient(120% 80% at 72% 12%, color-mix(in srgb, var(--glow-1) 88%, transparent) 0%, transparent 56%),
      radial-gradient(96% 74% at 12% 94%, color-mix(in srgb, var(--glow-2) 82%, transparent) 0%, transparent 52%),
      var(--surface)}
    .lp-hero-split2 .scene svg{position:absolute;inset:0;width:100%;height:100%}
    .lp-hero-split2 .price-float{position:absolute;left:16px;bottom:16px;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:.85em 1.1em;display:flex;align-items:baseline;gap:.7em}
    .lp-hero-split2 .price-float .label{display:block;font-family:var(--font-body);font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 .25em}
    .lp-hero-split2 .price-float .now{font-family:var(--font-display);font-weight:700;font-size:1.55rem;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
    .lp-hero-split2 .price-float .was{font-family:var(--font-body);font-size:.82rem;color:var(--muted);text-decoration:line-through;font-weight:600}
    @media (max-width:768px){
      .lp-hero-split2 .in{grid-template-columns:1fr;gap:2.4em}
      .lp-hero-split2 .media{order:-1}
      .lp-hero-split2 .copy{text-align:center}
      .lp-hero-split2 h1,.lp-hero-split2 .subhead{max-width:none;margin-inline:auto}
    }
  </style>
  <div class="glow" aria-hidden="true"></div>
  <div class="in">
    <div class="copy reveal-stagger">
      <span class="eyebrow">{{hero_eyebrow}}</span>
      <h1>{{hero_headline}} <em>{{hero_headline_emphasis}}</em></h1>
      <p class="subhead">{{hero_subhead}}</p>
      <div class="cta-block">
        <a class="btn-primary" href="#book">
          {{primary_cta_label}}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <p class="cta-micro">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
          {{cta_micro}}
        </p>
      </div>
    </div>
    <div class="media reveal">
      <!-- media placeholder: swap the .scene for a real <img> when building -->
      <div class="scene" data-parallax="0.14" aria-hidden="true">
        <svg viewBox="0 0 400 460" preserveAspectRatio="xMidYMid slice">
          <g fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1.6" stroke-linecap="round">
            <path d="M212 132 C 250 120, 274 150, 268 196 C 262 244, 236 300, 208 340 C 196 356, 178 356, 168 340 C 146 302, 132 246, 138 198 C 144 150, 174 122, 212 132 Z"/>
            <path d="M204 148 C 204 210, 204 296, 204 340"/>
            <path d="M204 214 C 224 200, 244 194, 258 196"/>
            <path d="M204 214 C 184 200, 164 196, 150 200"/>
          </g>
          <g fill="currentColor" fill-opacity=".14"><circle cx="112" cy="360" r="30"/><circle cx="300" cy="96" r="20"/></g>
        </svg>
      </div>
      <div class="price-float">
        <div>
          <span class="label">{{price_label}}</span>
          <span class="now">{{offer_price}}</span>
        </div>
        <span class="was">{{offer_was_price}}</span>
      </div>
    </div>
  </div>
</section>
