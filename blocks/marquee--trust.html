<section class="lp-marquee-trust" aria-label="Trust and accreditation">
  <style>
    .lp-marquee-trust{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:clamp(14px,2.4vw,20px) 0}
    .lp-marquee-trust .marquee{justify-content:center}
    .lp-marquee-trust .marquee-track{gap:clamp(22px,4vw,44px);padding:0 clamp(11px,2vw,22px)}
    .lp-marquee-trust .item{display:inline-flex;align-items:center;gap:.5em;white-space:nowrap;font-family:var(--font-body);font-size:.78rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink)}
    .lp-marquee-trust .tick{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.25em;height:1.25em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7em;font-weight:700}
    .lp-marquee-trust .sep{flex:none;color:var(--accent);opacity:.45}
  </style>
  <div class="marquee">
    <div class="marquee-track">
      <span class="item"><span class="tick" aria-hidden="true">&#10003;</span>{{trust_1}}</span>
      <span class="sep" aria-hidden="true">&bull;</span>
      <span class="item"><span class="tick" aria-hidden="true">&#10003;</span>{{trust_2}}</span>
      <span class="sep" aria-hidden="true">&bull;</span>
      <span class="item"><span class="tick" aria-hidden="true">&#10003;</span>{{trust_3}}</span>
      <span class="sep" aria-hidden="true">&bull;</span>
      <span class="item"><span class="tick" aria-hidden="true">&#10003;</span>{{trust_4}}</span>
      <span class="sep" aria-hidden="true">&bull;</span>
      <span class="item"><span class="tick" aria-hidden="true">&#10003;</span>{{trust_5}}</span>
      <span class="sep" aria-hidden="true">&bull;</span>
      <span class="item"><span class="tick" aria-hidden="true">&#10003;</span>{{trust_6}}</span>
      <span class="sep" aria-hidden="true">&bull;</span>
    </div>
  </div>
</section>
