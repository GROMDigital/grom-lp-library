<section class="lp-media-panel">
  <style>
    /* MEDIA ARCHETYPE: a single full-width photo panel with a floating glass
       caption chip. A visual breather beat between content sections (clinic
       shot, treatment room, result). Image zooms gently on hover. Tokens only.
       The caption chip's translucent-white glass has no token equivalent, so
       it stays rgba white by design. */
    .lp-media-panel,.lp-media-panel *{box-sizing:border-box}
    .lp-media-panel{background:var(--bg);padding:var(--space-section) var(--gutter)}
    .lp-media-panel .in{max-width:var(--maxw);margin:0 auto}
    .lp-media-panel .photo-panel{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--ghost-color);box-shadow:var(--shadow);aspect-ratio:16/10}
    .lp-media-panel .photo-panel img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);transition:transform 1.2s var(--ease)}
    .lp-media-panel .photo-panel:hover img{transform:scale(1.06)}
    .lp-media-panel .photo-caption{position:absolute;left:16px;bottom:16px;z-index:2;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.7);border-radius:var(--r-pill);padding:8px 14px;font-family:var(--font-body);font-size:12.5px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm)}
    .lp-media-panel .photo-caption .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
    @media (prefers-reduced-motion: reduce){
      .lp-media-panel .photo-panel img,.lp-media-panel .photo-panel:hover img{transition:none;transform:scale(1.02)}
    }
  </style>
  <div class="in">
    <div class="photo-panel reveal">
      <img src="{{media_image}}" alt="{{media_alt}}" loading="lazy">
      <span class="photo-caption"><span class="dot" aria-hidden="true"></span> {{media_caption}}</span>
    </div>
  </div>
</section>
