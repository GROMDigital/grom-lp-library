<section class="lp-practitioner-plate">
  <style>
    .lp-practitioner-plate{background:var(--surface);padding:var(--space-section) var(--gutter)}
    .lp-practitioner-plate .in{max-width:var(--maxw);margin:0 auto}
    .lp-practitioner-plate .kicker{display:flex;align-items:center;justify-content:center;gap:.7em;color:var(--accent);font-family:var(--font-body);letter-spacing:.16em;text-transform:uppercase;font-size:.76rem;font-weight:700;margin:0 0 clamp(20px,3vw,32px)}
    .lp-practitioner-plate .kicker::before,.lp-practitioner-plate .kicker::after{content:"";width:34px;height:1px;background:var(--border)}
    .lp-practitioner-plate .stage{position:relative;max-width:560px;margin:0 auto;padding-bottom:clamp(88px,14vw,132px)}
    .lp-practitioner-plate .plate{position:relative;aspect-ratio:5/6;border-radius:var(--radius);overflow:hidden;background:linear-gradient(155deg,var(--ink),var(--accent))}
    .lp-practitioner-plate .plate::after{content:"";position:absolute;inset:12px;border:1px solid var(--accent-ink);opacity:.35;border-radius:calc(var(--radius) - 4px);pointer-events:none;z-index:2}
    .lp-practitioner-plate .plate svg.face{position:absolute;inset:0;width:100%;height:100%;z-index:1}
    .lp-practitioner-plate .plate .orb{position:absolute;border-radius:50%;background:var(--accent-ink);opacity:.1;z-index:0}
    .lp-practitioner-plate .plate .orb.a{width:220px;height:220px;top:-60px;right:-40px}
    .lp-practitioner-plate .plate .orb.b{width:150px;height:150px;bottom:40px;left:-50px}
    .lp-practitioner-plate .card{position:relative;z-index:3;width:min(88%,440px);margin:-88px auto 0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,3.4vw,34px);text-align:center}
    .lp-practitioner-plate .mark{font-family:var(--font-display);font-size:3rem;line-height:.4;color:var(--accent);opacity:.4;display:block;height:.5em}
    .lp-practitioner-plate blockquote{margin:0 0 1.1em}
    .lp-practitioner-plate .q{font-family:var(--font-display);font-size:clamp(1.2rem,2vw,1.5rem);font-style:italic;line-height:1.32;color:var(--ink);margin:0}
    .lp-practitioner-plate .rule{width:40px;height:2px;background:var(--accent);margin:0 auto 1em;border:0}
    .lp-practitioner-plate .name{font-family:var(--font-body);font-size:1.02rem;font-weight:700;color:var(--ink);margin:0}
    .lp-practitioner-plate .title{font-family:var(--font-body);font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:.25em 0 0}
  </style>
  <div class="in reveal">
    <p class="kicker">In the practitioner's words</p>
    <div class="stage">
      <div class="plate" role="img" aria-label="{{founder_image_alt}}" data-src="{{founder_image_url}}">
        <span class="orb a" data-parallax="0.12" aria-hidden="true"></span>
        <span class="orb b" data-parallax="0.08" aria-hidden="true"></span>
        <svg class="face" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
            <path d="M132 470 C132 372 164 338 200 338 C236 338 268 372 268 470"/>
            <circle cx="200" cy="236" r="84"/>
            <path d="M160 224 C170 214 184 214 194 224"/>
            <path d="M206 224 C216 214 230 214 240 224"/>
            <path d="M182 280 C192 290 208 290 218 280"/>
            <path d="M200 236 L200 262"/>
          </g>
          <g stroke="var(--accent-ink)" stroke-width="1" opacity="0.22" fill="none">
            <path d="M40 60 H120 M40 60 V140"/>
            <path d="M360 420 H280 M360 420 V340"/>
          </g>
        </svg>
      </div>
      <figure class="card">
        <span class="mark" aria-hidden="true">&ldquo;</span>
        <blockquote><p class="q">{{founder_quote}}</p></blockquote>
        <hr class="rule" aria-hidden="true">
        <figcaption>
          <p class="name">{{founder_name}}</p>
          <p class="title">{{founder_title}}</p>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
