<section class="lp-practitioner-split">
  <style>
    .lp-practitioner-split{background:var(--bg);padding:var(--space-section) var(--gutter)}
    .lp-practitioner-split .in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(28px,5vw,64px);align-items:center}
    .lp-practitioner-split .portrait{position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);background:linear-gradient(160deg,var(--surface),var(--border))}
    .lp-practitioner-split .portrait svg{position:absolute;inset:0;width:100%;height:100%}
    .lp-practitioner-split .copy{text-align:left}
    .lp-practitioner-split .eyebrow{display:inline-block;color:var(--accent);font-family:var(--font-body);letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;font-weight:700;margin:0 0 .8em}
    .lp-practitioner-split h2{font-family:var(--font-display);font-size:var(--fs-h2);color:var(--ink);line-height:1.1;margin:0 0 .15em}
    .lp-practitioner-split .title{font-family:var(--font-body);font-size:.98rem;font-weight:700;color:var(--accent);margin:0 0 1em}
    .lp-practitioner-split .bio{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);margin:0 0 1.3em;max-width:52ch}
    .lp-practitioner-split .creds{display:flex;flex-wrap:wrap;gap:.6em;margin:0 0 1.5em;padding:0;list-style:none}
    .lp-practitioner-split .creds li{display:inline-flex;align-items:center;gap:.5em;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:.55em 1em;font-family:var(--font-body);font-size:.8rem;font-weight:700;color:var(--muted)}
    .lp-practitioner-split .creds svg{flex:none;color:var(--accent)}
    .lp-practitioner-split .btn-primary{display:inline-flex;align-items:center;gap:.6em;background:linear-gradient(90deg,var(--cta-grad-a),var(--cta-grad-b));color:var(--accent-ink);font-family:var(--font-body);font-weight:700;font-size:1rem;padding:.95em 1.8em;border-radius:var(--btn-radius);box-shadow:var(--shadow-cta);text-decoration:none}
    .lp-practitioner-split .btn-primary svg{flex:none}
    @media (max-width:768px){
      .lp-practitioner-split .in{grid-template-columns:1fr}
      .lp-practitioner-split .portrait{order:-1;max-width:340px;margin-inline:auto;width:100%}
    }
  </style>
  <div class="in">
    <div class="portrait" role="img" aria-label="{{founder_image_alt}}" data-src="{{founder_image_url}}">
      <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
          <path d="M140 470 C140 380 168 348 200 348 C232 348 260 380 260 470"/>
          <circle cx="200" cy="250" r="78"/>
          <path d="M164 240 C172 232 184 232 192 240"/>
          <path d="M208 240 C216 232 228 232 236 240"/>
          <path d="M186 290 C194 298 206 298 214 290"/>
          <path d="M200 250 L200 274"/>
        </g>
        <g fill="var(--accent)" opacity="0.14">
          <circle cx="320" cy="120" r="46"/>
          <circle cx="86" cy="410" r="34"/>
        </g>
      </svg>
    </div>
    <div class="copy reveal">
      <span class="eyebrow">Meet your practitioner</span>
      <h2>{{founder_name}}</h2>
      <p class="title">{{founder_title}}</p>
      <p class="bio">{{founder_bio}}</p>
      <ul class="creds">
        <li>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          {{credential_1}}
        </li>
        <li>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          {{credential_2}}
        </li>
        <li>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          {{credential_3}}
        </li>
      </ul>
      <a class="btn-primary" href="#book">
        {{cta_label}}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>
</section>
