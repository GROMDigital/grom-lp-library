<section class="lp-process-ghost">
  <style>
    .lp-process-ghost{background:var(--bg);padding:var(--space-section) var(--gutter)}
    .lp-process-ghost .in{max-width:var(--maxw);margin:0 auto}
    .lp-process-ghost .head{max-width:36ch;margin:0 0 clamp(30px,4vw,52px)}
    .lp-process-ghost .kicker{font-family:var(--font-body);font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 .9em}
    .lp-process-ghost h2{font-family:var(--font-display);font-size:var(--fs-h2);line-height:1.12;color:var(--ink);margin:0}
    .lp-process-ghost .row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3.4vw,44px)}
    .lp-process-ghost .step{position:relative;min-width:0;padding-top:clamp(30px,4vw,46px);border-top:2px solid var(--accent)}
    .lp-process-ghost .ghost{position:absolute;right:0;top:-.34em;font-family:var(--font-display);font-weight:700;font-size:clamp(70px,9vw,116px);line-height:.8;color:var(--ghost-color);pointer-events:none;user-select:none;z-index:0;overflow-wrap:anywhere}
    .lp-process-ghost .num{position:relative;z-index:1;font-family:var(--font-body);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 1em}
    .lp-process-ghost h3{position:relative;z-index:1;font-family:var(--font-display);font-size:clamp(1.15rem,2vw,1.42rem);line-height:1.2;color:var(--ink);margin:0 0 .5em}
    .lp-process-ghost p{position:relative;z-index:1;font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);margin:0;max-width:36ch}
    @media (max-width:768px){
      .lp-process-ghost .row{grid-template-columns:1fr;gap:clamp(30px,7vw,42px)}
    }
  </style>
  <div class="in">
    <div class="head reveal">
      <p class="kicker">{{process_kicker}}</p>
      <h2>{{process_headline}}</h2>
    </div>
    <div class="row reveal-stagger">
      <div class="step">
        <span class="ghost" aria-hidden="true">01</span>
        <p class="num">Step 01</p>
        <h3>{{step_1_title}}</h3>
        <p>{{step_1_body}}</p>
      </div>
      <div class="step">
        <span class="ghost" aria-hidden="true">02</span>
        <p class="num">Step 02</p>
        <h3>{{step_2_title}}</h3>
        <p>{{step_2_body}}</p>
      </div>
      <div class="step">
        <span class="ghost" aria-hidden="true">03</span>
        <p class="num">Step 03</p>
        <h3>{{step_3_title}}</h3>
        <p>{{step_3_body}}</p>
      </div>
    </div>
  </div>
</section>
