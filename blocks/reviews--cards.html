<section class="lp-reviews-cards">
  <style>
    .lp-reviews-cards{background:var(--surface);padding:var(--space-section) var(--gutter)}
    .lp-reviews-cards .in{max-width:var(--maxw);margin:0 auto}
    .lp-reviews-cards .head{text-align:center;max-width:44ch;margin:0 auto clamp(28px,4vw,44px)}
    .lp-reviews-cards h2{font-family:var(--font-display);font-size:var(--fs-h2);color:var(--ink);line-height:1.12;margin:0 0 .35em}
    .lp-reviews-cards .rating{display:inline-flex;align-items:center;gap:.5em;font-family:var(--font-body);font-size:.95rem;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-pill);padding:.5em 1.1em}
    .lp-reviews-cards .rating .stars{color:var(--accent);letter-spacing:.14em}
    .lp-reviews-cards .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gutter)}
    .lp-reviews-cards .card{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(22px,3vw,30px);text-align:left;display:flex;flex-direction:column}
    .lp-reviews-cards .mark{font-family:var(--font-display);font-size:2.6rem;line-height:.6;color:var(--accent);opacity:.35;height:.5em;display:block}
    .lp-reviews-cards .stars{color:var(--accent);font-size:1rem;letter-spacing:.15em;margin:0 0 .7em;display:block}
    .lp-reviews-cards .quote{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink);margin:0 0 1.2em}
    .lp-reviews-cards .who{display:flex;align-items:center;gap:.7em;margin-top:auto}
    .lp-reviews-cards .avatar{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);flex:none}
    .lp-reviews-cards .name{font-family:var(--font-body);font-size:.9rem;font-weight:700;color:var(--ink);margin:0;line-height:1.3}
    @media (max-width:768px){
      .lp-reviews-cards .grid{grid-template-columns:1fr}
    }
  </style>
  <div class="in">
    <div class="head reveal">
      <h2>{{reviews_headline}}</h2>
      <p class="rating"><span class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span> {{review_rating}}</p>
    </div>
    <div class="grid reveal-stagger">
      <div class="card">
        <span class="mark" aria-hidden="true">&ldquo;</span>
        <span class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <p class="quote">{{review_1_quote}}</p>
        <div class="who">
          <span class="avatar" aria-hidden="true"></span>
          <p class="name">{{review_1_name}}</p>
        </div>
      </div>
      <div class="card">
        <span class="mark" aria-hidden="true">&ldquo;</span>
        <span class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <p class="quote">{{review_2_quote}}</p>
        <div class="who">
          <span class="avatar" aria-hidden="true"></span>
          <p class="name">{{review_2_name}}</p>
        </div>
      </div>
      <div class="card">
        <span class="mark" aria-hidden="true">&ldquo;</span>
        <span class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <p class="quote">{{review_3_quote}}</p>
        <div class="who">
          <span class="avatar" aria-hidden="true"></span>
          <p class="name">{{review_3_name}}</p>
        </div>
      </div>
    </div>
  </div>
</section>
